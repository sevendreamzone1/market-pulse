name: Refresh market data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC; covers the Indian weekday session with a margin on either side.
    # GitHub may delay scheduled jobs. This is not a real-time scheduler.
    - cron: '2-59/5 3-10 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check app.js
      - run: node tests/dashboard.test.cjs
      - uses: actions/cache/restore@v4
        with:
          path: data/market.json
          key: market-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-
      - name: Fetch completed candles and calculate signals
        env:
          MARKET_PROVIDER: ${{ vars.MARKET_PROVIDER || 'auto' }}
          UPSTOX_ACCESS_TOKEN: ${{ secrets.UPSTOX_ACCESS_TOKEN }}
        run: python scripts/fetch_market.py
      - uses: actions/cache/save@v4
        with:
          path: data/market.json
          key: market-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare static website
        run: |
          mkdir -p dist/data
          cp index.html styles.css app.js favicon.svg .nojekyll dist/
          cp data/market.json dist/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
